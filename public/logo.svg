<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E2A9" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA8214" />
      <stop offset="100%" stop-color="#E5C378" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#090B10" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Circle Base -->
  <circle cx="250" cy="250" r="235" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Architectural Frame & Emblem -->
  <g transform="translate(0, -15)">
    <!-- Stylized Modern Building / Interior Ribs -->
    <path d="M 175 270 L 175 160 L 210 130 L 210 270 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 210 130 L 250 95 L 290 130 L 290 270" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 290 130 L 325 160 L 325 270 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Horizon Line & Interior Grid Lines -->
    <line x1="150" y1="270" x2="350" y2="270" stroke="url(#goldGrad)" stroke-width="3.5" />
    <line x1="165" y1="282" x2="335" y2="282" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>

    <!-- Interlocking Monogram S & R (Architectural Cut) -->
    <text x="210" y="240" font-family="'Cinzel', 'Playfair Display', serif" font-size="110" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">S</text>
    <text x="285" y="240" font-family="'Cinzel', 'Playfair Display', serif" font-size="110" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">R</text>

    <!-- Star / Diamond Accent -->
    <polygon points="250,75 254,84 263,88 254,92 250,101 246,92 237,88 246,84" fill="url(#goldGrad)" />
  </g>

  <!-- Circular Brand Typography -->
  <text x="250" y="340" font-family="'Cinzel', sans-serif" font-size="28" font-weight="800" letter-spacing="6" fill="url(#goldGrad)" text-anchor="middle">
    SKYROCK
  </text>
  <text x="250" y="372" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="8" fill="#FFFFFF" text-anchor="middle" opacity="0.9">
    INTERIORS LIMITED
  </text>
  
  <line x1="170" y1="392" x2="330" y2="392" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4" />
  
  <text x="250" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" letter-spacing="4" fill="#D4AF37" text-anchor="middle">
    BESPOKE CRAFTSMANSHIP
  </text>
</svg>
